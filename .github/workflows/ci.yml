name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reference-impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Build canonical example + verify against spec
        run: npm run build:example
      - name: Run unit tests (10 tests across schema + chain + 3 invariants + byte-stability)
        run: npm test
      - name: Pretty-print first event for log readability
        run: head -n 1 examples/sample-output-stream.ndjson | node -e "process.stdin.on('data', d => console.log(JSON.stringify(JSON.parse(d.toString()), null, 2)))"
